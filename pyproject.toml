[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mysterial"
version = "0.1.0"
description = "Internal AI Code Knowledge Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # GraphQL
    "strawberry-graphql[fastapi]>=0.220.0",
    # Git
    "gitpython>=3.1.41",
    # AST parsing
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.4",
    # Embeddings
    "sentence-transformers>=2.5.1",
    # Graph DB
    "neo4j>=5.17.0",
    # Vector DB
    "qdrant-client>=1.8.2",
    # Config / data validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # HTTP client
    "httpx>=0.27.0",
    # YAML / JSON Schema
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.1",
    # MCP (Model Context Protocol)
    "mcp>=1.0.0",
    # Async support
    "anyio>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
mysterial = "mysterial.api.app:main"
mysterial-mcp = "mysterial.mcp.gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
